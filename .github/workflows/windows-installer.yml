name: Build Windows Installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prepare application icon
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("assets/barcode-icon.ico", [Convert]::FromBase64String((Get-Content "assets/barcode-icon.ico.base64" -Raw).Trim()))
      - name: Publish self-contained Windows app (multi-file for faster startup)
        shell: pwsh
        run: |
          dotnet publish BarcodeStudio.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishReadyToRun=true -o publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "publish/BarcodeStudio.exe")) { throw "Missing published executable" }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '1.1.0' }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "installer\BarcodeStudio.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BarcodeStudio-Windows-Installer
          path: installer-output/*.exe
      - name: Publish GitHub Release on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "$env:GITHUB_REF_NAME" installer-output/*.exe --title "Barcode Studio $env:GITHUB_REF_NAME" --generate-notes
